spring:
  jpa:
    hibernate.ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: false
      jdbc.time_zone: UTC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
      separator: ";"
      encoding: UTF-8
  datasource:
    url: jdbc:postgresql://localhost:5432/plus-smart-home-tech
    driverClassName: org.postgresql.Driver
    username: postgres
    password: postgres

grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

telemetry:
  kafka:
    bootstrap-servers: "localhost:9092"
    hub-processor:
      group: "hub-snapshots.group.id"
      topic: "telemetry.hubs.v1"
    snapshot-processor:
      group: "hub-event.group.id"
      topic: "telemetry.snapshots.v1"